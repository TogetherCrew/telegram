x-telegram-common: &telegram-common
  build:
    context: .
    dockerfile: Dockerfile
    target: development
  restart: unless-stopped
  env_file:
    - ./.env
  depends_on:
    rabbitmq:
      condition: service_healthy
    neo4j:
      condition: service_healthy
    mongodb:
      condition: service_healthy

services:
  mongodb:
    container_name: mongodb
    image: mongo:7.0.5
    restart: unless-stopped
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=pass
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 1m30s
      timeout: 10s
      retries: 2
      start_period: 30s

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.12.12-management
    restart: unless-stopped
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 1m30s
      timeout: 10s
      retries: 2
      start_period: 30s

  neo4j:
    container_name: neo4j
    image: neo4j:5.9.0
    restart: unless-stopped
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      - neo4j_data:/data
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    environment:
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_AUTH=neo4j/password
    healthcheck:
      test: [ "CMD", "wget", "http://localhost:7474" ]
      interval: 1m30s
      timeout: 10s
      retries: 2
      start_period: 40s

  telegram-bot:
    <<: [ *telegram-common ]
    container_name: telegram-bot
    command: npm run start bot
  telegram-events:
    <<: [ *telegram-common ]
    container_name: telegram-events
    command: npm run start event-store
  telegram-graph:
    <<: [ *telegram-common ]
    container_name: telegram-graph
    command: npm run start graph-store
  telegram-question:
    <<: [ *telegram-common ]
    container_name: telegram-question
    command: npm run start question-service

volumes:
  mongo_data:
  neo4j_data:
  neo4j_import:
  neo4j_plugins:
